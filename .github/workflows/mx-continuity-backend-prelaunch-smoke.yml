name: MX Continuity deployed backend prelaunch safety smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mx-continuity-backend-prelaunch-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert public intake and checkout OFF before sending any request
        shell: bash
        run: |
          node <<'JS'
          const origin='https://theurbanmatrixlab.com';
          const project='https://xdaxbueyftyljsrhabpx.supabase.co';
          const get=async url=>{
            const r=await fetch(url,{signal:AbortSignal.timeout(15000)});
            if(!r.ok||new URL(r.url).hostname!=='theurbanmatrixlab.com')throw new Error('Live safety configuration unavailable: '+url);
            return await r.text();
          };
          (async()=>{
            const config=await get(origin+'/mx-continuity/assets/intake-config.js');
            const script=await get(origin+'/mx-continuity/assets/site.js');
            if(!config.includes('enabled:false')||
               !config.includes('turnstileSiteKey:""')||
               !script.includes('prelaunch:true')||
               !script.includes('checkoutEnabled:false')){
              throw new Error('Public site no longer in verified prelaunch state; NO backend requests attempted');
            }
            // Use only the already public client publishable key, never a secret.
            const key=config.match(/publishableKey:"(sb_publishable_[A-Za-z0-9_-]+)"/)?.[1];
            if(!key)throw new Error('No publishable key in live approved intake configuration');
            const cases=[
              ['mx-project-inquiry','intake_paused'],
              ['veil-public-support','prelaunch'],
              ['veil-create-checkout',null] // Authenticated-user gate must reject public requests before billing handler
            ];
            for(const [slug,expected] of cases){
              const r=await fetch(project+'/functions/v1/'+slug,{
                method:'POST',
                headers:{'Origin':origin,'Content-Type':'application/json','apikey':key,'Authorization':'Bearer '+key},
                body:'{}',
                redirect:'error',
                signal:AbortSignal.timeout(15000)
              });
              const response=await r.json().catch(()=>({}));
              const ok=expected===null ? r.status===401 : (r.status===503 && response?.error===expected);
              console.log(JSON.stringify({endpoint:slug,status:r.status,error:response?.error,
                expected,prelaunch_blocked:ok}));
              if(!ok)throw new Error('Unexpected live backend behavior: '+slug);
            }
            // Deliberately invalid, unsigned-in-effect webhook payload; must be refused.
            // No customer or payment objects are created and no valid Stripe event is simulated.
            const webhook=await fetch(project+'/functions/v1/veil-stripe-webhook',{
              method:'POST',
              headers:{'Content-Type':'application/json','stripe-signature':'t=0,v1=00000000000000000000000000000000'},
              body:'{}',
              redirect:'error',
              signal:AbortSignal.timeout(15000)
            });
            const webhookResult=await webhook.json().catch(()=>({}));
            const webhookRejected=[400,401,403,503].includes(webhook.status);
            console.log(JSON.stringify({endpoint:'veil-stripe-webhook',status:webhook.status,
              error:webhookResult?.error,rejected_invalid_signature:webhookRejected}));
            if(!webhookRejected)throw new Error('Webhook did not reject invalid signature in prelaunch');
            // Probe Data API as a public anonymous visitor. Never display customer rows.
            const guardedTables=['mx_project_inquiries','mx_client_inquiries',
              'veil_support_tickets','veil_setup_checkouts','veil_setup_payment_events',
              'mx_ops_inspections'];
            for(const table of guardedTables){
              const res=await fetch(project+'/rest/v1/'+table+'?select=id&limit=1',{
                headers:{'apikey':key,'Authorization':'Bearer '+key},
                redirect:'error',
                signal:AbortSignal.timeout(15000)
              });
              const body=await res.text();
              let accessible=false;
              if(res.status===200){
                let items;
                try{items=JSON.parse(body)}catch{throw new Error('Unreadable Data API response: '+table)}
                if(!Array.isArray(items))throw new Error('Unexpected Data API result shape: '+table);
                accessible=items.length>0;
              }else if(![401,403,404].includes(res.status)){
                throw new Error('Unexpected Data API status on '+table+': '+res.status);
              }
              console.log(JSON.stringify({table,anonymous_status:res.status,
                visible_rows:accessible?'LEAK':'NONE',result:accessible?'FAIL':'PASS'}));
              if(accessible)throw new Error('Public access to protected business records: '+table);
            }
            console.log('PASS: inquiry/support 503; checkout auth 401; invalid webhook rejected; public guards remain off');
          })().catch(error=>{console.error(String(error));process.exitCode=1;});
          JS
