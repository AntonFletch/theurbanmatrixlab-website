name: Jeremy Inquiry Smoke Test
on:
  push:
    paths:
      - '.github/workflows/jeremy-inquiry-smoke.yml'
      - 'jeremy-emmons/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate inquiry page script
        run: |
          node --check jeremy-emmons/script.js
          grep -q 'id="quickInquiry"' jeremy-emmons/index.html
          grep -q 'name="painting_id"' jeremy-emmons/index.html
          grep -q 'name="presentation"' jeremy-emmons/index.html
      - name: Check live publication
        run: |
          curl -fsSL --retry 3 --retry-delay 2 'https://theurbanmatrixlab.com/jeremy-emmons/' -o /tmp/jeremy.html
          grep -q 'id="quickInquiry"' /tmp/jeremy.html
          curl -fsSL --retry 3 'https://theurbanmatrixlab.com/jeremy-emmons/script.js' -o /tmp/jeremy.js
          grep -q 'quickInquiry' /tmp/jeremy.js
      - name: Verify inquiry API and email alert configuration
        env:
          API_KEY: sb_publishable_eZ5ydFnC0SESdeT9Up_-0A_Mez9ljvZ
          URL: https://xdaxbueyftyljsrhabpx.supabase.co/functions/v1/jeremy-art-inquiry
        run: |
          status="$(curl -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' "$URL" -H 'Origin: https://theurbanmatrixlab.com' -H "apikey: $API_KEY")"
          echo "HTTP $status"
          cat /tmp/health.json
          test "$status" = "200"
          jq -e '.ok == true and .inquiry_storage == "active"' /tmp/health.json
          jq -r '"OWNER EMAIL ALERT: "+.owner_email_alert' /tmp/health.json
      - name: Browser test gallery and real form submit on mobile
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p /tmp/jeremy-pw
          cd /tmp/jeremy-pw
          npm install --no-audit --no-fund --silent playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          cat > test.cjs <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            await page.goto('https://theurbanmatrixlab.com/jeremy-emmons/', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.locator('#gallery .art-card').first().waitFor({timeout:15000});
            const cards = await page.locator('#gallery .art-card').count();
            if (cards !== 10) throw new Error('Expected 10 gallery paintings, got '+cards);
            await page.locator('#gallery .art-card .art-button').first().click();
            await page.locator('#artDialog[open]').waitFor();
            await page.locator('#closeModal').click();
            await page.locator('#quickName').fill('QA Site Test');
            await page.locator('#quickEmail').fill('qa-test@example.com');
            await page.locator('#quickPainting').selectOption('JE-005');
            await page.locator('#quickFramed').selectOption('framed');
            await page.locator('#quickConsent').check();
            await page.locator('#quickSubmit').click();
            await page.locator('#quickInquiryStatus.is-success').waitFor({ timeout: 30000 });
            const result = await page.locator('#quickInquiryStatus').innerText();
            if (!result.includes('received')) throw new Error('Unexpected form result: '+result);
            if (errors.length) throw new Error('Browser JavaScript errors: '+errors.join('; '));
            console.log('MOBILE FORM PASS: 10 gallery cards, artwork preview, live submission receipt, no page JS errors');
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1) });
          JS
          node test.cjs
      - name: Submit marked QA inquiry, verify receipt and idempotence
        if: github.event_name == 'workflow_dispatch'
        env:
          API_KEY: sb_publishable_eZ5ydFnC0SESdeT9Up_-0A_Mez9ljvZ
          URL: https://xdaxbueyftyljsrhabpx.supabase.co/functions/v1/jeremy-art-inquiry
        run: |
          set -euo pipefail
          REQUEST_ID="$(cat /proc/sys/kernel/random/uuid)"
          export REQUEST_ID
          python3 - <<'PY' > /tmp/payload.json
          import json,os
          print(json.dumps(dict(request_id=os.environ["REQUEST_ID"],contact_name="QA Site Test",contact_email="qa-test@example.com",contact_phone="",painting_id="JE-003",presentation="unframed",frame_style="",message="Automated QA test only. Not a customer.",contact_consent=True,website="")))
          PY
          status="$(curl -sS --max-time 20 -o /tmp/response.json -w '%{http_code}' -X POST "$URL" -H 'Origin: https://theurbanmatrixlab.com' -H 'Content-Type: application/json' -H "apikey: $API_KEY" --data-binary @/tmp/payload.json)"
          echo "First request HTTP $status"
          cat /tmp/response.json
          test "$status" = "201"
          jq -e '.ok == true and (.inquiry_id|type=="string")' /tmp/response.json
          status="$(curl -sS --max-time 20 -o /tmp/replay.json -w '%{http_code}' -X POST "$URL" -H 'Origin: https://theurbanmatrixlab.com' -H 'Content-Type: application/json' -H "apikey: $API_KEY" --data-binary @/tmp/payload.json)"
          echo "Replay HTTP $status"
          test "$status" = "200"
          jq -e '.ok == true and .replayed == true' /tmp/replay.json
      - name: Refuse foreign-origin submission
        if: github.event_name == 'workflow_dispatch'
        env:
          API_KEY: sb_publishable_eZ5ydFnC0SESdeT9Up_-0A_Mez9ljvZ
        run: |
          status="$(curl -sS --max-time 20 -o /tmp/foreign.json -w '%{http_code}' -X POST 'https://xdaxbueyftyljsrhabpx.supabase.co/functions/v1/jeremy-art-inquiry' -H 'Origin: https://not-theurbanmatrixlab.example' -H 'Content-Type: application/json' -H "apikey: $API_KEY" --data '{"contact_name":"No","contact_email":"no@example.com"}')"
          test "$status" = "403"
