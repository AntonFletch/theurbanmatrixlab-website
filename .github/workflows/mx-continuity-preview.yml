name: Publish original MX Continuity website
on:
  push:
    branches: [main]
    paths:
      - 'mx-continuity/**'
      - '.github/workflows/mx-continuity-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mx-continuity-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify original approved MX Continuity files and prelaunch safeguards
        shell: bash
        run: |
          set -euo pipefail
          test -f mx-continuity/index.html
          test -f mx-continuity/assets/style.css
          test -f mx-continuity/assets/mx-hero-laptop.webp
          test -f mx-continuity/support.html
          test -f mx-continuity/terms.html
          test -f mx-continuity/privacy.html
          test -f mx-continuity/cancellation.html
          grep -q 'Care that continues' mx-continuity/index.html
          grep -q '\$89' mx-continuity/index.html
          grep -q '\$199' mx-continuity/index.html
          grep -q '\$400' mx-continuity/index.html
          grep -q 'checkoutEnabled:false' mx-continuity/assets/site.js
      - name: Verify original MX Continuity site and launch guards
        run: node mx-continuity/scripts/verify-static-site.mjs
      - name: Check public email JavaScript syntax
        run: |
          node --check mx-continuity/assets/site.js
          node --check mx-continuity/assets/contact-email.js
          node --check mx-continuity/assets/support-email.js
          node --check mx-continuity/app/portal.js
      - name: Verify public CTA behavior and launch safeguards
        run: node mx-continuity/scripts/verify-static-site.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload original approved website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./mx-continuity
      - name: Publish original approved website
        id: deployment
        uses: actions/deploy-pages@v4
