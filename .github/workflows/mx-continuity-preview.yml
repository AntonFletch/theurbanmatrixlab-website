name: Publish MX Continuity Business Website
on:
  push:
    branches: [main]
    paths:
      - 'mx-continuity/**'
      - '.github/workflows/mx-continuity-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mx-continuity-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload standalone MX Continuity website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./mx-continuity
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
