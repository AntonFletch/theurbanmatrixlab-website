    <circle cx="128" cy="128" r="112" stroke-width="1"/>
    <circle cx="128" cy="128" r="84" stroke-width="1.4"/>
    <path d="M 90,161 H 166" stroke-width="1"/>
  </g>
  <g fill="#e5bd66" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
