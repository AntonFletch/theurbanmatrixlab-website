<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">UMX stamp</title>
  <desc id="desc">Gold circular stamp for The Urban Matrix Lab LLC, Missoula, Montana.</desc>
  <defs>
    <path id="top" d="M 34,128 A 94,94 0 0 1 222,128"/>
    <path id="bottom" d="M 43,147 A 93,93 0 0 0 213,147"/>
  </defs>
  <circle cx="128" cy="128" r="123" fill="#101923"/>
  <g fill="none" stroke="#e5bd66">
