<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 540" role="img" aria-labelledby="title desc">
<title id="title">MX Visibility search and growth emblem</title>
<desc id="desc">A geometric magnifying glass encircling ascending analytics bars and an upward trend arrow, surrounded by fine orbit lines.</desc>
