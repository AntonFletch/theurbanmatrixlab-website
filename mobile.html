<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02060a"><title>UMX Mobile</title><style>*{box-sizing:border-box}html,body{margin:0;background:#02060a;min-height:100%;font-family:Arial,sans-serif}.wrap{position:relative;width:100%;min-height:100vh}.hero{display:block;width:100%;height:auto;min-height:100vh;object-fit:cover;object-position:top center}.cta{position:absolute;z-index:5;bottom:6.4%;height:7.8%;border:0;background:transparent;opacity:0}.services{left:7%;width:45%}.story{right:3%;width:43%}.nav{position:fixed;z-index:10;left:50%;bottom:max(6px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:7px;padding:7px 10px;border:1px solid #e8b65466;border-radius:999px;background:#02060acc}.nav a{display:block;width:10px;height:10px;border:1px solid #e8b654;border-radius:50%}.nav a:first-child{background:#e8b654}</style></head><body><div class="wrap"><img id="hero" class="hero" alt="UMX mobile homepage"><a class="cta services" href="/#services" aria-label="Our Services"></a><a class="cta story" href="/#story" aria-label="Our Story"></a></div><nav class="nav" aria-label="UMX pages"><a href="/mobile.html" aria-label="Home"></a><a href="/#services" aria-label="Services"></a><a href="/#story" aria-label="Our Story"></a><a href="/#portals" aria-label="Portals"></a><a href="/#contact" aria-label="Contact"></a></nav><script>(async()=>{try{const r=await fetch('/revamp-preview/assets-compact/mobile-home.b64?v=497353f',{cache:'no-store'});if(!r.ok)throw new Error('asset '+r.status);const b64=(await r.text()).trim().replace(/\s+/g,'');document.getElementById('hero').src='data:image/jpeg;base64,'+b64}catch(e){document.body.innerHTML='<div style="color:#ddd;padding:24px">Mobile artwork failed to load.</div>';console.error(e)}})();</script></body></html>
