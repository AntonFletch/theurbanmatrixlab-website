<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05080d"><meta name="umx-revamp-build" content="pages-live-bab91157"><title>UMX Future Revamp — Live Preview</title><style>:root{--gold:#e8b654;--bg:#04070c;--ink:#f4efe6}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}body{min-height:100vh}.stage{position:relative;width:100%;min-height:100vh;background:#05080d}.page{display:none;position:relative;width:100%}.page.active{display:block}.master{display:block;width:100%;height:auto;background:#05080d}.master:not([src]){min-height:100vh}.dock{position:fixed;z-index:30;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;padding:6px 8px;border:1px solid #e8b65459;border-radius:999px;background:#03060ab8}.dock button{width:9px;height:9px;padding:0;border-radius:50%;border:1px solid var(--gold);background:transparent}.dock button.active{background:var(--gold);box-shadow:0 0 10px #e8b654}.hotspot{position:absolute;z-index:8;width:22px;height:22px;padding:0;border:0;background:transparent;color:#ffd36e;font-family:"Noto Sans Egyptian Hieroglyphs","Noto Sans Cuneiform","Segoe UI Symbol",serif;font-size:18px;line-height:22px;text-align:center;text-shadow:0 0 5px #e8b654cc;cursor:pointer}.hotspot:after{content:none}.hotspot[data-symbol="geometry"]{font-size:15px}.hotspot[data-symbol="community"]{font-size:17px}.home .h-ancestry{left:5.1%;top:11.8%}.home .h-pillars{left:41.5%;top:20.5%}.home .h-geometry{left:60.2%;top:12.8%}.home .h-sunrise{left:62.5%;top:28.8%}.home .h-human{left:53.3%;top:41.2%}.home .h-community{left:63.8%;top:50.2%}.home .h-foundation{left:57.6%;top:63.2%}.modal{position:fixed;z-index:50;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:#020407b8}.modal.open{display:flex}.panel{width:min(560px,100%);max-height:82vh;overflow:auto;background:#05090ffa;border:1px solid #e8b6546b;padding:24px;border-radius:8px}.panel .tag,.panel h3{color:var(--gold)}.panel h2{font-family:Georgia,serif;font-weight:500}.panel p{color:#d2cabf;line-height:1.52}.close{float:right;background:none;border:0;color:#eee;font-size:1.5rem}.asset-error{display:none;position:fixed;z-index:40;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 18px;border:1px solid #e8b65466;background:#070b11;color:#ddd;border-radius:6px}@media(max-width:700px){.hotspot{width:18px;height:18px;font-size:15px;line-height:18px}.hotspot[data-symbol="geometry"]{font-size:13px}.hotspot[data-symbol="community"]{font-size:14px}.master:not([src]){min-height:70vh}}</style></head><body><main class="stage"><section class="page home active" data-page="home"><img class="master" data-b64="home" alt="UMX future revamp homepage visual master"><button class="hotspot h-ancestry" data-symbol="ancestry" aria-label="Ancient Builder — Wedjat">𓂀</button><button class="hotspot h-pillars" data-symbol="pillars" aria-label="Pillars — Djed">𓊽</button><button class="hotspot h-geometry" data-symbol="geometry" aria-label="Geometry — ancient rosette">✺</button><button class="hotspot h-sunrise" data-symbol="sunrise" aria-label="Sunrise — solar disk">☉</button><button class="hotspot h-human" data-symbol="human" aria-label="Human — Ankh">𓋹</button><button class="hotspot h-community" data-symbol="community" aria-label="Community — Dingir">𒀭</button><button class="hotspot h-foundation" data-symbol="foundation" aria-label="Foundation — triangle">△</button></section><section class="page" data-page="services"><img class="master" data-b64="services" alt="UMX Services"></section><section class="page" data-page="story"><img class="master" data-b64="story" alt="UMX Our Story"></section><section class="page" data-page="portals"><img class="master" data-b64="portals" alt="UMX Portals"></section><section class="page" data-page="contact"><img class="master" data-b64="contact" alt="UMX Contact"></section></main><nav class="dock" aria-label="Revamp preview pages"><button class="active" data-go="home" aria-label="Home" title="Home"></button><button data-go="services" aria-label="Services" title="Services"></button><button data-go="story" aria-label="Our Story" title="Our Story"></button><button data-go="portals" aria-label="Portals" title="Portals"></button><button data-go="contact" aria-label="Contact" title="Contact"></button></nav><div class="asset-error" id="asset-error">Preview artwork failed to load.</div><div class="modal" id="modal"><div class="panel"><button class="close" id="close" aria-label="Close">×</button><div class="tag" id="symbol-tag"></div><h2 id="symbol-title"></h2><div id="symbol-body"></div></div></div><script>const ASSET_ROOT='/revamp-preview/assets-compact/';const pages=['home','services','story','portals','contact'];const content={ancestry:{title:'The Ancient Builder — Wedjat',tag:'Civilization • Knowledge • Continuity',what:'The information marker is the ancient Egyptian Wedjat, or Eye of Horus, placed beside imagery inspired by ancient monumental sculpture.',history:'The Wedjat was associated with protection, restoration and wholeness. Monumental figures preserve memory, identity and cultural continuity.',mis:'Modern popular culture sometimes folds ancient eye imagery into later secret-society stories, but the Wedjat predates those associations by millennia.',umx:'Awareness, accountability and learning from what humanity built before us.',movement:'Learn from the past, serve in the present and build for the future.'},pillars:{title:'The Pillars — Djed',tag:'Threshold • Structure • Transition',what:'The marker is the Egyptian djed pillar, paired with the monumental columns framing the path forward.',history:'The djed represented stability and endurance in ancient Egypt. Architectural pillars also carried structural and civic meaning across civilizations.',mis:'Paired pillars and pillar symbols are much older and broader than any one later organization.',umx:'Structure turns opportunity into lasting progress.',movement:'Moving from the world as it is toward what people can build together.'},geometry:{title:'Sacred Geometry — Rosette',tag:'Balance • Order • Relationship',what:'A small rosette marks the layered geometric forms.',history:'Rosettes appear throughout ancient Near Eastern art, while geometry expresses proportion, measurement, balance and order across many traditions.',mis:'Neither rosettes nor geometric forms belong to one modern organization or universal hidden code.',umx:'Understand relationships, then build with intention.',movement:'Practical work and higher purpose reinforce one another.'},sunrise:{title:'The Sunrise — Solar Disk',tag:'Renewal • Hope • A Brighter Tomorrow',what:'The solar-disk marker identifies the rising light beyond the community.',history:'Solar imagery represented life, renewal, order and new beginnings in numerous ancient cultures.',mis:'A solar disk does not carry one exclusive religious, political or esoteric meaning.',umx:'A brighter tomorrow through service, opportunity and stronger communities.',movement:'We work toward a better future.'},human:{title:'The Human — Ankh',tag:'Responsibility • Action • Choice',what:'The ankh, an ancient Egyptian sign associated with life, marks the intentionally unnamed human figure.',history:'The ankh is one of the best-known Egyptian signs for life. Human figures facing a horizon commonly communicate journey and contemplation in visual storytelling.',mis:'The figure is not a ruler, idol or specific person.',umx:'The past surrounds them. The community lies ahead. The light remains beyond both.',movement:'Systems change when living people serve, build, learn and act.'},community:{title:'The Community — Dingir',tag:'People • Places • Purpose',what:'The marker uses the Mesopotamian cuneiform sign DINGIR beside the living city and valley.',history:'DINGIR was used in ancient Mesopotamian writing in connection with deity or divinity and as a determinative before divine names.',mis:'Its historical meaning should not be collapsed into modern conspiracy symbolism or treated as a generic translation for community.',umx:'Here the marker points visitors toward the larger question of purpose while the city itself represents the people and places the system serves.',movement:'Opportunity becomes real when it reaches actual communities.'},foundation:{title:'The Foundation — Triangle',tag:'Structure • Stability • Ascent',what:'A simple triangular marker identifies the foundation concept.',history:'Triangles are fundamental stable forms in geometry, engineering and architecture and appear throughout historical visual traditions.',mis:'A triangle has no single universal hidden meaning.',umx:'Build from a stable base, then move upward with purpose.',movement:'Lasting change needs disciplined work, reliable systems, opportunity and service.'}};async function loadMaster(page){if(!page)return;const img=page.querySelector('.master[data-b64]');if(!img||img.dataset.loaded==='1'||img.dataset.loading==='1')return;img.dataset.loading='1';const name=img.dataset.b64;img.onload=()=>{img.dataset.loaded='1';delete img.dataset.loading;document.getElementById('asset-error').style.display='none'};img.onerror=()=>{delete img.dataset.loading;document.getElementById('asset-error').style.display='block'};if(name==='home'){img.src=ASSET_ROOT+'home.jpg?v=89cb2a5';return}try{const url=new URL(ASSET_ROOT+name+'.b64',location.origin);url.searchParams.set('v','db1971d');const r=await fetch(url.toString(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status+' '+url);const b64=(await r.text()).trim().replace(/\s+/g,'');if(!b64.startsWith('/9j/'))throw new Error('invalid JPEG payload');img.src='data:image/jpeg;base64,'+b64}catch(err){console.error(err);delete img.dataset.loading;document.getElementById('asset-error').style.display='block'}}function go(name,historyMode='replace'){if(!pages.includes(name))name='home';const target=document.querySelector('.page[data-page="'+name+'"]');document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p===target));document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===name));loadMaster(target);const url='#'+name;if(historyMode==='push')history.pushState({page:name},'',url);else if(historyMode==='replace')history.replaceState({page:name},'',url);window.scrollTo({top:0,left:0,behavior:'instant'})}document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go,'push');return}const h=e.target.closest('[data-symbol]');if(h){const d=content[h.dataset.symbol];symbol_tag.textContent=d.tag;symbol_title.textContent=d.title;symbol_body.innerHTML='<h3>What it is</h3><p>'+d.what+'</p><h3>Historical meaning</h3><p>'+d.history+'</p><h3>Common misconceptions</h3><p>'+d.mis+'</p><h3>UMX meaning</h3><p>'+d.umx+'</p><h3>Within the movement</h3><p>'+d.movement+'</p>';modal.classList.add('open')}});close.onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};document.addEventListener('keydown',e=>{if(modal.classList.contains('open')){if(e.key==='Escape')modal.classList.remove('open');return}const active=document.querySelector('.page.active')?.dataset.page||'home';let i=pages.indexOf(active);if(e.key==='ArrowRight'){go(pages[(i+1)%pages.length],'push')}if(e.key==='ArrowLeft'){go(pages[(i-1+pages.length)%pages.length],'push')}});let sx=0,sy=0;document.addEventListener('touchstart',e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});document.addEventListener('touchend',e=>{if(modal.classList.contains('open'))return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.4){const active=document.querySelector('.page.active')?.dataset.page||'home';let i=pages.indexOf(active);go(dx<0?pages[(i+1)%pages.length]:pages[(i-1+pages.length)%pages.length],'push')}},{passive:true});window.addEventListener('popstate',()=>go((location.hash||'#home').slice(1),'none'));const initial=(location.hash||'#home').slice(1);go(initial,'replace');setTimeout(()=>document.querySelectorAll('.page').forEach(loadMaster),250);</script></body></html>
