<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<title>UMX Future Revamp — Live Preview</title>
<style>
:root{--gold:#e8b654;--bg:#04070c;--ink:#f4efe6}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}body{min-height:100vh}.stage{position:relative;width:100%;min-height:100vh;background:#05080d}.page{display:none;position:relative;width:100%;margin:0 auto}.page.active{display:block}.master{display:block;width:100%;height:auto;max-width:none;margin:0 auto;background:#05080d}.master:not([src]){min-height:100vh}.clickzone{position:absolute;z-index:4;top:0;height:8%;background:transparent;border:0;cursor:pointer}.cz-home{left:26%;width:8%}.cz-services{left:35%;width:10%}.cz-portals{left:46%;width:9%}.cz-story{left:56%;width:9%}.cz-contact{left:66%;width:10%}.dock{position:fixed;z-index:30;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;padding:6px 8px;border:1px solid rgba(232,182,84,.35);border-radius:999px;background:rgba(3,6,10,.72);backdrop-filter:blur(10px);box-shadow:0 10px 30px #0008}.dock button{width:9px;height:9px;padding:0;border-radius:50%;border:1px solid var(--gold);background:transparent;cursor:pointer}.dock button.active{background:var(--gold);box-shadow:0 0 10px #e8b654}.label{position:fixed;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:31;color:#aa9e8e;font-size:9px;letter-spacing:.15em;text-transform:uppercase;opacity:.55}.hotspot{position:absolute;z-index:8;width:28px;height:28px;border-radius:50%;border:2px solid #ffd36e;background:#e8b65433;box-shadow:0 0 0 5px #e8b6541f,0 0 16px #e8b654cc;cursor:pointer}.hotspot:after{content:"";position:absolute;inset:7px;border-radius:50%;background:#ffd36e}.home .h-ancestry{left:5.1%;top:11.8%}.home .h-pillars{left:41.5%;top:20.5%}.home .h-geometry{left:60.2%;top:12.8%}.home .h-sunrise{left:62.5%;top:28.8%}.home .h-human{left:53.3%;top:41.2%}.home .h-community{left:63.8%;top:50.2%}.home .h-foundation{left:57.6%;top:63.2%}.modal{position:fixed;z-index:50;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:#020407b8}.modal.open{display:flex}.panel{width:min(560px,100%);max-height:82vh;overflow:auto;background:rgba(5,9,15,.98);border:1px solid rgba(232,182,84,.42);box-shadow:0 24px 80px #000;padding:24px;border-radius:8px}.panel .tag{color:var(--gold);font-size:.7rem;letter-spacing:.13em;text-transform:uppercase}.panel h2{font-family:Georgia,serif;font-weight:500;font-size:2rem;margin:6px 0 16px}.panel h3{color:var(--gold);font-size:.72rem;text-transform:uppercase;margin:18px 0 5px;letter-spacing:.05em}.panel p{margin:0;color:#d2cabf;line-height:1.52;font-size:.92rem}.panel .close{float:right;background:none;border:0;color:#eee;font-size:1.5rem;cursor:pointer}.mobile-note{display:none}.asset-error{display:none;position:fixed;z-index:40;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 18px;border:1px solid #e8b65466;background:#070b11;color:#ddd;font-size:12px;border-radius:6px}
@media(max-width:700px){.master{width:100%;min-height:auto}.master:not([src]){min-height:70vh}.clickzone{display:none}.hotspot{width:24px;height:24px}.home .h-ancestry{left:4%;top:12%}.home .h-pillars{left:41%;top:20%}.home .h-geometry{left:60%;top:13%}.home .h-sunrise{left:63%;top:29%}.home .h-human{left:54%;top:41%}.home .h-community{left:64%;top:50%}.home .h-foundation{left:58%;top:63%}.label{display:none}.dock{bottom:max(6px,env(safe-area-inset-bottom))}.mobile-note{display:block;position:fixed;left:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:31;font-size:9px;color:#9b9184;opacity:.62;letter-spacing:.06em}.panel{padding:20px}.panel h2{font-size:1.65rem}}
</style>
</head>
<body>
<main class="stage" id="stage">
  <section class="page home active" data-page="home"><img class="master" data-b64="assets/home-fix.b64" alt="UMX future revamp homepage visual master"><button class="hotspot h-ancestry" data-symbol="ancestry" aria-label="Explain the ancient builder"></button><button class="hotspot h-pillars" data-symbol="pillars" aria-label="Explain the pillars"></button><button class="hotspot h-geometry" data-symbol="geometry" aria-label="Explain sacred geometry"></button><button class="hotspot h-sunrise" data-symbol="sunrise" aria-label="Explain the sunrise"></button><button class="hotspot h-human" data-symbol="human" aria-label="Explain the human"></button><button class="hotspot h-community" data-symbol="community" aria-label="Explain the community"></button><button class="hotspot h-foundation" data-symbol="foundation" aria-label="Explain the foundation"></button></section>
  <section class="page" data-page="services"><img class="master" data-b64="assets/services-fix.b64" alt="UMX future revamp services page visual master"></section>
  <section class="page" data-page="story"><img class="master" data-b64="assets/story-fix.b64" alt="UMX future revamp Our Story page visual master"></section>
  <section class="page" data-page="portals"><img class="master" data-b64="assets/portals-fix.b64" alt="UMX future revamp portals page visual master"></section>
  <section class="page" data-page="contact"><img class="master" data-b64="assets/contact-fix.b64" alt="UMX future revamp contact page visual master"></section>
  <div id="clickzones"><button class="clickzone cz-home" data-go="home" aria-label="Home"></button><button class="clickzone cz-services" data-go="services" aria-label="Services"></button><button class="clickzone cz-portals" data-go="portals" aria-label="Portals"></button><button class="clickzone cz-story" data-go="story" aria-label="Our Story"></button><button class="clickzone cz-contact" data-go="contact" aria-label="Contact"></button></div>
</main>
<nav class="dock" aria-label="Preview pages"><button class="active" data-go="home" aria-label="Home"></button><button data-go="services" aria-label="Services"></button><button data-go="story" aria-label="Our Story"></button><button data-go="portals" aria-label="Portals"></button><button data-go="contact" aria-label="Contact"></button></nav>
<div class="label">Future revamp preview</div><div class="mobile-note">UMX preview</div><div class="asset-error" id="asset-error">Preview artwork failed to load. Refresh this page once.</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="symbol-title"><div class="panel"><button class="close" id="close" aria-label="Close">×</button><div class="tag" id="symbol-tag">UMX Symbol Layer</div><h2 id="symbol-title"></h2><div id="symbol-body"></div></div></div>
<script>
const content={
ancestry:{title:'The Ancient Builder',tag:'Civilization • Knowledge • Continuity',what:'A representation inspired by ancient Near Eastern and Egyptian monumental sculpture.',history:'Monumental figures were used across ancient civilizations to preserve memory, authority, identity and cultural continuity.',mis:'Ancient monumental imagery is sometimes reduced to modern secret-society or fictional interpretations. Its historical use is much broader.',umx:'Civilization is built by people who accept responsibility for what comes next.',movement:'We learn from the past, serve in the present and build for the future.'},
pillars:{title:'The Pillars',tag:'Threshold • Structure • Transition',what:'Two monumental columns framing the path toward the valley and sunrise.',history:'Pillars have served structural, civic, ceremonial and symbolic roles across many civilizations, often marking important entrances and transitions.',mis:'Paired pillars are sometimes assumed to belong to one later organization or tradition. They appear across architecture far earlier and more broadly.',umx:'Structure creates the doorway through which opportunity can become lasting progress.',movement:'The threshold represents moving from the world as it is toward the world people can build together.'},
geometry:{title:'Sacred Geometry',tag:'Balance • Order • Relationship',what:'Layered geometric forms placed behind the physical landscape.',history:'Geometric forms have been used in architecture, mathematics, art and spiritual traditions to express proportion, balance and order.',mis:'No single organization owns geometric symbolism, and similar forms can carry very different meanings across cultures.',umx:'Observe the system, understand its relationships, then build with intention.',movement:'Individual and community, practical work and higher purpose, must reinforce one another.'},
sunrise:{title:'The Sunrise',tag:'Renewal • Hope • A Brighter Tomorrow',what:'The rising sun beyond the mountains and community.',history:'The sun has represented life, renewal, time and new beginnings across many civilizations.',mis:'Sun imagery is sometimes interpreted only through a religious or political lens. Its use is far older and much broader.',umx:'A brighter tomorrow through service, opportunity and stronger communities.',movement:'We do not just imagine a better future. We work toward it.'},
human:{title:'The Human',tag:'Responsibility • Action • Choice',what:'The figure is intentionally unnamed. It can represent any person willing to carry responsibility forward.',history:'Human figures facing a horizon have long been used in art to communicate journey, contemplation and the relationship between the individual and a larger world.',mis:'The figure is not a ruler, idol or specific person. The identity is intentionally open.',umx:'The past surrounds the person. The community lies ahead. The light remains beyond both. UMX is carried through human action.',movement:'Systems change only when people decide to serve, build, learn and act.'},
community:{title:'The Community',tag:'People • Places • Purpose',what:'The living city and valley beneath the larger symbols and structures.',history:'Cities and settlements are physical records of people cooperating across generations to build shared life.',mis:'The destination in this artwork is not a hidden realm or secret order. It is an ordinary human community made stronger.',umx:'People and places are the reason the system exists.',movement:'Better housing, work, service, learning and opportunity become real when they reach actual neighborhoods and actual people.'},
foundation:{title:'The Foundation',tag:'Structure • Stability • Ascent',what:'The triangular foundation mark beneath the human figure.',history:'Triangles are among the most stable basic geometric forms and appear throughout engineering, architecture and symbolic art.',mis:'A triangle does not have one universal hidden meaning. Context determines what it communicates.',umx:'Build from a stable base, then move upward with purpose.',movement:'Lasting change needs foundations: disciplined work, reliable systems, opportunity and service.'}
};
async function loadMaster(page){
  if(!page)return;
  const img=page.querySelector('.master[data-b64]');
  if(!img||img.dataset.loaded==='1'||img.dataset.loading==='1')return;
  img.dataset.loading='1';
  try{
    const r=await fetch(img.dataset.b64,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const b64=(await r.text()).replace(/\s+/g,'');
    if(!b64)throw new Error('empty asset');
    await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src='data:image/webp;base64,'+b64;});
    img.dataset.loaded='1';
    delete img.dataset.loading;
  }catch(err){
    console.error('UMX preview asset load failed',img.dataset.b64,err);
    delete img.dataset.loading;
    document.getElementById('asset-error').style.display='block';
  }
}
function go(name){
  const target=document.querySelector('.page[data-page="'+name+'"]');
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.dataset.page===name));
  document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===name));
  loadMaster(target);
  history.replaceState(null,'','#'+name);
  scrollTo({top:0,behavior:'instant'});
}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return;}const h=e.target.closest('[data-symbol]');if(h){const d=content[h.dataset.symbol];document.getElementById('symbol-tag').textContent=d.tag;document.getElementById('symbol-title').textContent=d.title;document.getElementById('symbol-body').innerHTML=`<h3>What it is</h3><p>${d.what}</p><h3>Historical meaning</h3><p>${d.history}</p><h3>Common misconceptions</h3><p>${d.mis}</p><h3>UMX meaning</h3><p>${d.umx}</p><h3>Within the movement</h3><p>${d.movement}</p>`;document.getElementById('modal').classList.add('open');}});
document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('open');
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')});
addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modal').classList.remove('open')});
const initial=location.hash.slice(1);go(['home','services','story','portals','contact'].includes(initial)?initial:'home');
setTimeout(()=>document.querySelectorAll('.page').forEach(loadMaster),700);
</script>
</body></html>
