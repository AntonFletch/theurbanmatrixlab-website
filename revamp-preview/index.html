<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05080d"><title>UMX Future Revamp — Live Preview</title><style>:root{--gold:#e8b654;--bg:#04070c;--ink:#f4efe6}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}body{min-height:100vh}.stage{position:relative;width:100%;min-height:100vh;background:#05080d}.page{display:none;position:relative;width:100%}.page.active{display:block}.master{display:block;width:100%;height:auto;background:#05080d}.master:not([src]){min-height:100vh}.dock{position:fixed;z-index:30;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;padding:6px 8px;border:1px solid #e8b65459;border-radius:999px;background:#03060ab8}.dock button{width:9px;height:9px;padding:0;border-radius:50%;border:1px solid var(--gold);background:transparent}.dock button.active{background:var(--gold);box-shadow:0 0 10px #e8b654}.hotspot{position:absolute;z-index:8;width:16px;height:16px;border-radius:50%;border:1px solid #ffd36e;background:#e8b65433;box-shadow:0 0 0 3px #e8b6541f,0 0 9px #e8b654cc}.hotspot:after{content:"";position:absolute;inset:4px;border-radius:50%;background:#ffd36e}.home .h-ancestry{left:5.1%;top:11.8%}.home .h-pillars{left:41.5%;top:20.5%}.home .h-geometry{left:60.2%;top:12.8%}.home .h-sunrise{left:62.5%;top:28.8%}.home .h-human{left:53.3%;top:41.2%}.home .h-community{left:63.8%;top:50.2%}.home .h-foundation{left:57.6%;top:63.2%}.modal{position:fixed;z-index:50;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:#020407b8}.modal.open{display:flex}.panel{width:min(560px,100%);max-height:82vh;overflow:auto;background:#05090ffa;border:1px solid #e8b6546b;padding:24px;border-radius:8px}.panel .tag,.panel h3{color:var(--gold)}.panel h2{font-family:Georgia,serif;font-weight:500}.panel p{color:#d2cabf;line-height:1.52}.close{float:right;background:none;border:0;color:#eee;font-size:1.5rem}.asset-error{display:none;position:fixed;z-index:40;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 18px;border:1px solid #e8b65466;background:#070b11;color:#ddd;border-radius:6px}@media(max-width:700px){.hotspot{width:14px;height:14px}.hotspot:after{inset:4px}.master:not([src]){min-height:70vh}}</style></head><body><main class="stage"><section class="page home active" data-page="home"><img class="master" data-b64="home" alt="UMX future revamp homepage visual master"><button class="hotspot h-ancestry" data-symbol="ancestry"></button><button class="hotspot h-pillars" data-symbol="pillars"></button><button class="hotspot h-geometry" data-symbol="geometry"></button><button class="hotspot h-sunrise" data-symbol="sunrise"></button><button class="hotspot h-human" data-symbol="human"></button><button class="hotspot h-community" data-symbol="community"></button><button class="hotspot h-foundation" data-symbol="foundation"></button></section><section class="page" data-page="services"><img class="master" data-b64="services" alt="UMX Services"></section><section class="page" data-page="story"><img class="master" data-b64="story" alt="UMX Our Story"></section><section class="page" data-page="portals"><img class="master" data-b64="portals" alt="UMX Portals"></section><section class="page" data-page="contact"><img class="master" data-b64="contact" alt="UMX Contact"></section></main><nav class="dock"><button class="active" data-go="home"></button><button data-go="services"></button><button data-go="story"></button><button data-go="portals"></button><button data-go="contact"></button></nav><div class="asset-error" id="asset-error">Preview artwork failed to load.</div><div class="modal" id="modal"><div class="panel"><button class="close" id="close">×</button><div class="tag" id="symbol-tag"></div><h2 id="symbol-title"></h2><div id="symbol-body"></div></div></div><script>const ASSET_ROOT='/revamp-preview/assets-compact/';const content={ancestry:{title:'The Ancient Builder',tag:'Civilization • Knowledge • Continuity',what:'A representation inspired by ancient monumental sculpture.',history:'Monumental figures preserve memory, identity and cultural continuity.',mis:'Ancient imagery is broader than later secret-society interpretations.',umx:'Civilization is built by people who accept responsibility for what comes next.',movement:'Learn from the past, serve in the present and build for the future.'},pillars:{title:'The Pillars',tag:'Threshold • Structure • Transition',what:'Monumental columns framing the path forward.',history:'Pillars have structural, civic and symbolic roles across civilizations.',mis:'Paired pillars are not owned by one later organization.',umx:'Structure turns opportunity into lasting progress.',movement:'Moving from the world as it is toward what people can build together.'},geometry:{title:'Sacred Geometry',tag:'Balance • Order • Relationship',what:'Layered geometric forms.',history:'Geometry expresses proportion, balance and order.',mis:'No single organization owns geometric symbolism.',umx:'Understand relationships, then build with intention.',movement:'Practical work and higher purpose reinforce one another.'},sunrise:{title:'The Sunrise',tag:'Renewal • Hope • A Brighter Tomorrow',what:'The rising sun beyond the community.',history:'The sun represents life, renewal and new beginnings across cultures.',mis:'Sun imagery is broader than one religious or political meaning.',umx:'A brighter tomorrow through service, opportunity and stronger communities.',movement:'We work toward a better future.'},human:{title:'The Human',tag:'Responsibility • Action • Choice',what:'An intentionally unnamed person.',history:'A figure facing the horizon communicates journey and contemplation.',mis:'The figure is not a ruler, idol or specific person.',umx:'The past surrounds them. The community lies ahead. The light remains beyond both.',movement:'Systems change when people serve, build, learn and act.'},community:{title:'The Community',tag:'People • Places • Purpose',what:'The living city and valley.',history:'Settlements record generations of human cooperation.',mis:'The destination is an ordinary human community made stronger.',umx:'People and places are the reason the system exists.',movement:'Opportunity becomes real when it reaches actual communities.'},foundation:{title:'The Foundation',tag:'Structure • Stability • Ascent',what:'The triangular foundation mark.',history:'Triangles are stable forms used throughout engineering and architecture.',mis:'A triangle has no single universal hidden meaning.',umx:'Build from a stable base, then move upward with purpose.',movement:'Lasting change needs disciplined work, reliable systems, opportunity and service.'}};async function loadMaster(page){if(!page)return;const img=page.querySelector('.master[data-b64]');if(!img||img.dataset.loaded==='1'||img.dataset.loading==='1')return;img.dataset.loading='1';const name=img.dataset.b64;img.onload=()=>{img.dataset.loaded='1';delete img.dataset.loading;document.getElementById('asset-error').style.display='none'};img.onerror=()=>{delete img.dataset.loading;document.getElementById('asset-error').style.display='block'};if(name==='home'){img.src=ASSET_ROOT+'home.jpg?v=89cb2a5';return}try{const url=new URL(ASSET_ROOT+name+'.b64',location.origin);url.searchParams.set('v','db1971d');const r=await fetch(url.toString(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status+' '+url);const b64=(await r.text()).trim().replace(/\s+/g,'');if(!b64.startsWith('/9j/'))throw new Error('invalid JPEG payload');img.src='data:image/jpeg;base64,'+b64}catch(err){console.error(err);delete img.dataset.loading;document.getElementById('asset-error').style.display='block'}}function go(name){const target=document.querySelector('.page[data-page="'+name+'"]');document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p===target));document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===name));loadMaster(target);history.replaceState(null,'','#'+name);scrollTo(0,0)}document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}const h=e.target.closest('[data-symbol]');if(h){const d=content[h.dataset.symbol];symbol_tag.textContent=d.tag;symbol_title.textContent=d.title;symbol_body.innerHTML='<h3>What it is</h3><p>'+d.what+'</p><h3>Historical meaning</h3><p>'+d.history+'</p><h3>Common misconceptions</h3><p>'+d.mis+'</p><h3>UMX meaning</h3><p>'+d.umx+'</p><h3>Within the movement</h3><p>'+d.movement+'</p>';modal.classList.add('open')}});close.onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};const initial=location.hash.slice(1);go(['home','services','story','portals','contact'].includes(initial)?initial:'home');setTimeout(()=>document.querySelectorAll('.page').forEach(loadMaster),500);</script></body></html>
