<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09070d"><meta name="robots" content="noindex,nofollow"><title>UMX Technology · Master Access</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="style.css"><style>
.access-page{min-height:100vh;display:grid;place-items:center;padding:40px 20px}.access-shell{width:min(100%,470px)}.access-brand{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 26px;padding:15px;border:1px solid rgba(230,191,123,.3);border-radius:16px;background:linear-gradient(140deg,#21152d,#0f0a17);box-shadow:0 12px 30px #0004}.access-symbol{display:block;width:88px;height:88px;object-fit:contain;flex:none}.access-brand-text{text-align:left;display:grid;gap:2px}.access-brand-text strong{font:700 clamp(1.05rem,5vw,1.4rem) Cinzel,Georgia,serif;letter-spacing:.07em;color:#e9c58e}.access-brand-text span{font-size:.62rem;color:#bdaec7;letter-spacing:.09em}.access-brand-text small{color:#b89cc9;font-size:.66rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.access-card{border:1px solid rgba(215,173,56,.23);background:linear-gradient(155deg,#17101d,#0b080f);border-radius:25px;padding:30px;box-shadow:var(--shadow)}.access-card h1{font-family:Georgia,serif;font-size:2.55rem;margin:0}.access-card>p{color:var(--muted)}.access-form{display:grid;gap:16px;margin-top:27px}.access-form label{display:grid;gap:8px;font-size:.69rem;font-weight:800;letter-spacing:.08em;color:#b7adbb}.access-form input{border:1px solid rgba(255,255,255,.1);background:#09070d;color:white;border-radius:12px;padding:13px}.access-form input:focus{outline:none;border-color:rgba(215,173,56,.55);box-shadow:0 0 0 3px rgba(215,173,56,.08)}.access-status{min-height:24px;color:#a89cab;font-size:.82rem}.back-link{display:block;text-align:center;margin-top:20px;color:#8f8394;font-size:.82rem}.back-link:hover{color:var(--gold)}.text-button{border:0;background:transparent;color:var(--gold);font-size:.78rem;padding:0;cursor:pointer;text-align:left}.access-divider{height:1px;background:rgba(255,255,255,.06);margin:22px 0}.password-rule{color:#726a77;font-size:.72rem;margin:-5px 0 0}
</style></head><body><main class="access-page"><div class="access-shell"><div class="access-brand"><img class="access-symbol" src="/umx-technology-mark.svg" alt="UMX Technology logo"><div class="access-brand-text"><strong>UMX TECHNOLOGY</strong><span>THE URBAN MATRIX LAB LLC</span><small>Master Access</small></div></div><section class="access-card"><p class="eyebrow">UMX TECHNOLOGY · PRIVATE SYSTEM</p><h1 id="access-title">Master Access</h1><p id="access-copy">Authorized owner, employee, and customer accounts only.</p>
<form id="login-form" class="access-form"><label>EMAIL<input id="email" required type="email" autocomplete="email"></label><label>PASSWORD<input id="password" required type="password" autocomplete="current-password"></label><button class="button button-primary" type="submit">Sign in</button><button class="text-button" id="forgot-button" type="button">Forgot password?</button><div id="status" class="access-status" role="status"></div></form>
<form id="password-form" class="access-form" hidden><label>NEW PASSWORD<input id="new-password" required type="password" minlength="10" autocomplete="new-password"></label><label>CONFIRM PASSWORD<input id="confirm-password" required type="password" minlength="10" autocomplete="new-password"></label><p class="password-rule">Use at least 10 characters. Avoid passwords you use elsewhere.</p><button class="button button-primary" type="submit">Set password & continue</button><div id="password-status" class="access-status" role="status"></div></form>
<form id="recovery-form" class="access-form" hidden><label>ACCOUNT EMAIL<input id="recovery-email" required type="email" autocomplete="email"></label><button class="button button-primary" type="submit">Send reset link</button><button class="text-button" id="back-login" type="button">Back to sign in</button><div id="recovery-status" class="access-status" role="status"></div></form>
</section><a class="back-link" href="index.html">← Back to public site</a></div></main><script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.118.0';
const SUPABASE_URL='https://xdaxbueyftyljsrhabpx.supabase.co';const SUPABASE_KEY='sb_publishable_eZ5ydFnC0SESdeT9Up_-0A_Mez9ljvZ';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const login=document.getElementById('login-form'),setPassword=document.getElementById('password-form'),recovery=document.getElementById('recovery-form');const status=document.getElementById('status');
const routeForRole=async(r,userId)=>{r=String(r||'').toLowerCase();if(['owner','admin'].includes(r)&&userId){const {data:m,error}=await supabase.from('veil_memberships').select('role,active').eq('user_id',userId).maybeSingle();if(error)throw new Error('Owner access could not be verified. Try signing in again.');if(m?.role==='origin'&&m.active===true)return'master.html';}if(['owner','admin','dispatcher','manager'].includes(r))return'owner.html';if(['employee','staff','worker'].includes(r))return'employee.html';return'customer.html'};
async function route(){const {data:{user},error}=await supabase.auth.getUser();if(error||!user)return;const {data:profile,error:pe}=await supabase.from('profiles').select('role').eq('id',user.id).maybeSingle();if(pe){status.textContent='Your account role could not be verified. Try signing in again.';return;}try{location.replace(await routeForRole(profile?.role,user.id));}catch(e){status.textContent=e.message;}}
const params=new URLSearchParams(location.search);const authMode=params.get('mode')||'';let invited=authMode==='invite'||authMode==='recovery'||location.hash.includes('type=invite')||location.hash.includes('type=recovery');
// Give Supabase a moment to exchange an invite/recovery callback for a session.
await new Promise(r=>setTimeout(r,80));
const existing=await supabase.auth.getSession();
if(invited&&existing.data.session){login.hidden=true;setPassword.hidden=false;document.getElementById('access-title').textContent=authMode==='recovery'?'Reset password':'Finish UMX account';document.getElementById('access-copy').textContent='Set a password for this private UMX account, then continue to the authorized portal.';}else if(existing.data.session){await route();}
login.addEventListener('submit',async e=>{e.preventDefault();status.textContent='Signing in…';const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error){status.textContent=error.message;return}status.textContent='Access granted.';const {data:profile,error:pe}=await supabase.from('profiles').select('role').eq('id',data.user.id).maybeSingle();if(pe){status.textContent='Signed in, but the account role could not be loaded.';return}try{location.replace(await routeForRole(profile?.role,data.user.id));}catch(e){status.textContent=e.message;}});
setPassword.addEventListener('submit',async e=>{e.preventDefault();const a=document.getElementById('new-password').value,b=document.getElementById('confirm-password').value,st=document.getElementById('password-status');if(a!==b){st.textContent='Passwords do not match.';return}st.textContent='Saving password…';const {error}=await supabase.auth.updateUser({password:a});if(error){st.textContent=error.message;return}st.textContent='Password saved. Opening UMX OS…';history.replaceState(null,'',location.pathname);await route();});
document.getElementById('forgot-button').onclick=()=>{login.hidden=true;recovery.hidden=false;document.getElementById('access-title').textContent='Reset access';document.getElementById('access-copy').textContent='Request a secure password-reset link for your UMX account.';document.getElementById('recovery-email').value=document.getElementById('email').value;};
document.getElementById('back-login').onclick=()=>{recovery.hidden=true;login.hidden=false;document.getElementById('access-title').textContent='Master Access';document.getElementById('access-copy').textContent='Authorized owner, employee, and customer accounts only.';};
recovery.addEventListener('submit',async e=>{e.preventDefault();const st=document.getElementById('recovery-status');st.textContent='Sending reset link…';const email=document.getElementById('recovery-email').value.trim();const redirectTo='https://theurbanmatrixlab.com/login.html?mode=recovery';const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo});st.textContent=error?error.message:'If the account is valid, a reset link has been sent.';});

</script></body></html>
